name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip horizon-x.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: SDK + NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - run: cargo install cargo-ndk
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - run: gradle -p horizon-x assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
      - uses: actions/upload-artifact@v4
        with:
          name: HorizonX-apk
          path: horizon-x/app/build/outputs/apk/debug/*.apk
